# Power system harness (work in progress)
# Scope: battery -> PDB -> the two KDE UBECUVC (inputs only), PDB ESC pads -> XT90 female at the wing
# split (VTOL motors), and PDB ESC pad -> forward-thrust ESC (direct, no wing split).
# The PDB -> flight controller link lives in flight_control_system.yaml.
#
# BEC architecture (current decision): two KDE UBECUVC, both on PDB ESC pads (battery bus).
#   - 12 V UBEC (ESC7 pads): Jetson (HP leads), SIYI camera (servo port 5), the four wing servos
#     (servo ports 1 to 4). Outputs are wired in cellular_system.yaml and the two wing fuselage-side files.
#   - 5 V UBEC (ESC8 pads): Mesh Rider radio (HP leads, rf_system.yaml) and the six wing LEDs (servo
#     ports 1 to 6, the two wing fuselage-side files). 5 V for now; the final voltage (5 V or 6 V) is open, see
#     the note on UBEC5_IN.
#   - PDB on-board BECs: the 5 V BEC only feeds the Cube through the PDB 6-pin output (and the Cube
#     peripherals: GPS, airspeed, LiDAR). The PDB 12 V BEC is not used.
# The two Waveshare 5G dongles are powered from the Jetson USB for now (cellular_system.yaml).
#
# Cable lengths are 0 for now (placeholder). Real lengths come after the layout analysis.
# Gauges and colors are recommendations, see the comment above each cable.

metadata:
  title: Power system
  description: Battery, PDB and BEC input wiring, plus VTOL motor power to the wing split and forward ESC power

# Parts that are bought but are not connectors or cables (WireViz adds these lines to the BOM).
additional_bom_items:

  # Power distribution board: axldrone PDB 400A (14 to 60 V input, eight ESC pad pairs, current
  # sensor, MOSFET soft switch, on-board 5 V and 12 V BECs). Moved here from flight_control_system.yaml.
  # Its pads and plugs are the PDB_* connectors below and PDB_FC_PWR in flight_control_system.yaml.
  # Many unrelated "PDB400A" boards are sold under similar names: the seller must be axldrone.
  - description: Power distribution board, 400 A
    qty: 1
    designators: PDB
    manufacturer: axldrone
    mpn: PDB 400A

  # Two KDE Direct UBECUVC, same model: UBEC12 set to 12 V (Jetson, camera, four wing servos) and UBEC5
  # set to 5 V (radio, six wing LEDs). Selectable 5, 6, 8 or 12 V output, 14S LiHV maximum input,
  # 10 A continuous. KDE has no separate part number: the SKU on kdedirect.com is KDE-UBECUVC.
  - description: UBEC, KDE UBECUVC (selectable 5, 6, 8, 12 V output)
    qty: 2
    designators: [UBEC12, UBEC5]
    manufacturer: KDE Direct
    mpn: KDE-UBECUVC

  # PDB soft power switch: ProMax PPS16006RL-11F, latching 16 mm metal pushbutton with LED ring.
  # It was a connector line (SW_BTN) before; it is a switch, so it is listed here and the connector
  # entry below stays in the diagram only. Its JST XH plug on the PDB side (PDB_SW) is a connector line.
  # TODO: terminal type (crimp or solder lug) and the LED resistor, see SW_BTN.
  - description: Pushbutton switch, 16 mm latching, metal, LED ring
    qty: 1
    designators: SW_BTN
    manufacturer: ProMax
    mpn: PPS16006RL-11F

  # Capacitor across the PDB battery bolts, 220 uF 100 V as the PDB datasheet recommends.
  # TODO: part not fixed yet (low-ESR, 100 V or higher, radial, ripple current rating). Same note as
  # CAP_BAT below.
  - description: Capacitor, electrolytic 220 uF 100 V, low-ESR
    qty: 1
    designators: CAP_BAT

connectors:

  # Battery input (J2). Per the axldrone PDB-400A datasheet it is bolted (3 mm bolt, ring lugs
  # on the battery cable), not soldered. The lugs belong to the battery cable, so they are added
  # when the battery side is decided. Board feature, so not in the BOM.
  # Battery side (connector, cable) is not decided yet, so only the PDB end is shown.
  PDB_J2BAT:
    type: Bolted ring-lug terminals (3 mm bolt)
    notes: "PDB battery input (J2). Board range 14-60 V. Battery: 12S 2P, 48.0 V nominal, 50.4 V max."
    pinlabels: [BAT_POS, BAT_NEG]
    ignore_in_bom: true

  # All eight ESC outputs as one board feature. Solder pads, no pin numbers,
  # so the pin IDs below are just 1-16 in label order.
  # These pads are assumed to sit on the battery bus, so they are used here as battery taps for
  # the BECs. TODO: check whether they are downstream of the soft-switch MOSFET (BEC off when the
  # switch is open) or upstream (BEC always on). The switch LED behaviour depends on it.
  PDB_ESC:
    type: Solder pads
    notes: "ESC outputs ESC1 to ESC8, + and - pad each."
    pinlabels: [ESC1_POS, ESC1_NEG, ESC2_POS, ESC2_NEG, ESC3_POS, ESC3_NEG, ESC4_POS, ESC4_NEG,
                ESC5_POS, ESC5_NEG, ESC6_POS, ESC6_NEG, ESC7_POS, ESC7_NEG, ESC8_POS, ESC8_NEG]
    hide_disconnected_pins: true
    ignore_in_bom: true

  # 12 V KDE UBECUVC input leads: factory 16 AWG red/black, pre-tinned 2 mm exposed ends.
  # The leads come with the UBEC, so they are modelled as cable W_PWR_01 and nothing goes in the BOM.
  # Output set to 12 V with the top button (voltage indicator LEDs 5/6/8/12 V). Loads: Jetson on the
  # HP leads, camera on servo port 5, four wing servos on servo ports 1 to 4.
  # Ratings at 12 V: 10 A continuous (600 s), 18 A total limit, 22 A peak (5 s), 3.3 A per servo port.
  # Load: realistic about 8 A (servos nowhere near stall). Worst case 11.0 A continuous with every
  # servo at 1.3 A, 14.6 A burst with every servo at 2.2 A; with a 40 W Jetson module about 12 A.
  # TODO: measure the real Jetson draw (set the nvpmodel power mode cap) and the real servo draw on
  # the bench, then check the margin against the 10 A continuous rating.
  # TODO: set and verify the output voltage with a meter BEFORE connecting any load.
  UBEC12_IN:
    type: UBEC input (factory leads exit the body)
    notes: "12 V KDE UBECUVC input: red (+), black (-). Input 14.8 V (4S) to 60.9 V (14S LiHV) per spec table."
    pinlabels: [IN_POS, IN_NEG]
    ignore_in_bom: true

  # 5 V KDE UBECUVC (same model as above, replaces the Teravolt AeroBuck-5). Input leads are the
  # factory 16 AWG red/black, so they are modelled as cable W_PWR_02 and nothing goes in the BOM.
  # Loads: Mesh Rider radio on the HP leads (1.6 A peak), six wing LEDs on servo ports 1 to 6 (0.8 A
  # peak each, 1 A max). About 6.4 A peak (7.6 A at the 1 A LED maximum), strobes are not on
  # continuously. Ratings at 5 V: 10 A continuous (600 s), 22 A total limit.
  # TODO: final output voltage (5 V or 6 V), decide before the first power-up. The radio is
  # specified 5 V +/- 5 % (4.75 to 5.25 V), so 6 V is out of spec for it (and for the USB dongles if
  # they move to this UBEC later); the StrobeIT input range is marked 5 V* in the notes, so check
  # the listing before going above 5 V. The wing LED wires are 22 AWG, about 0.25 V drop over 3 m,
  # so the LEDs do not need a higher voltage.
  # TODO: set and verify the output voltage with a meter BEFORE connecting any load.
  UBEC5_IN:
    type: UBEC input (factory leads exit the body)
    notes: "5 V KDE UBECUVC input: red (+), black (-). Input 14.8 V (4S) to 60.9 V (14S LiHV) per spec table."
    pinlabels: [IN_POS, IN_NEG]
    ignore_in_bom: true

  # Harness-side plug for the PDB soft power switch input (2-pin JST 2.5 mm on the board).
  # Datasheet: MOSFET anti-spark soft switch, power is on while the two pins are closed together
  # ("if not using the switch, short the switch pins"), so a latching switch is used. It is a
  # plain contact, so pin order does not matter. Datasheet also says not to switch it ON or OFF
  # with a load connected; ask axldrone before using it for reboots in the aircraft.
  # TODO: series is probably XH, but the datasheet gives no part number. Try an XHP-2 on the
  # board header; if it does not fit, switch to EH (EHR-2).
  PDB_SW:
    type: JST XH 2-pin plug housing
    subtype: female
    manufacturer: JST
    mpn: XHP-2
    notes: "PDB soft power switch. Crimp contacts SXH-001T-P0.6. Pin order does not matter."
    pinlabels: [SW_1, SW_2]

  # Latching 16 mm metal pushbutton with LED ring (ProMax PPS16006RL-11F, from the seller listing).
  # C and NO go to the PDB. The LED has its own two pins, not wired for now (the pushbutton LED is
  # left out of the BEC load; it would come from the 5 V UBEC). Listing says LED 5 V in one place
  # and 6 V in another.
  # TODO: confirm terminal type (listing says both "crimp style" and "solder lugs") and whether
  # the LED has a built-in resistor.
  SW_BTN:
    type: 16 mm latching metal pushbutton with LED ring
    manufacturer: ProMax
    mpn: PPS16006RL-11F
    notes: "SPST, C/NO/NC terminals. IP65. Red LED ring, separate LED pins. Closed = PDB on."
    pinlabels: ["C", "NO", "NC", "LED_POS", "LED_NEG"]   # NO is quoted on purpose: unquoted YAML reads NO as false
    hide_disconnected_pins: true
    ignore_in_bom: true   # listed as a switch in additional_bom_items

  # Recommended by the PDB datasheet: 220 uF 100 V capacitor on the battery side of the PDB.
  # Battery max is 50.4 V (12S), so 100 V leaves a wide margin. Low-ESR electrolytic.
  # Mount it close to the battery bolts and watch the polarity.
  # TODO: pick the part (low-ESR, 100 V or higher, radial, ripple current rating).
  CAP_BAT:
    type: Electrolytic capacitor 220 uF 100 V
    notes: "Battery side of the PDB, across B+ and B-. Observe polarity."
    pinlabels: [CAP_POS, CAP_NEG]
    ignore_in_bom: true   # listed as a capacitor in additional_bom_items

  # Wing split, fuselage side: one XT90 female per VTOL motor ESC. The wing side (XT90 male, then
  # the ESC) is added with the actuators system. The ESC power pads sit on the battery bus, so
  # these carry full battery voltage (50.4 V max) and the motor current.
  # Synthetic pin IDs (the XT90 has no pin numbers); the housing is keyed, so polarity cannot
  # be reversed.
  # Variant: plain XT90 (no anti-spark), decided. Use one variant on both sides of the split. XT90 is
  # rated for 90 A continuous: check against the real ESC peak current.
  XT90_VTOL1_F:
    type: XT90 female (plain)
    subtype: female
    manufacturer: Amass
    notes: "VTOL motor 1 (front right) power, wing split (fuselage side)"
    pinlabels: [POS, NEG]

  XT90_VTOL2_F:
    type: XT90 female (plain)
    subtype: female
    manufacturer: Amass
    notes: "VTOL motor 2 (rear left) power, wing split (fuselage side)"
    pinlabels: [POS, NEG]

  XT90_VTOL3_F:
    type: XT90 female (plain)
    subtype: female
    manufacturer: Amass
    notes: "VTOL motor 3 (front left) power, wing split (fuselage side)"
    pinlabels: [POS, NEG]

  XT90_VTOL4_F:
    type: XT90 female (plain)
    subtype: female
    manufacturer: Amass
    notes: "VTOL motor 4 (rear right) power, wing split (fuselage side)"
    pinlabels: [POS, NEG]

  # Forward-thrust ESC (APD 120F3, same ESC as the VTOL motors), battery input pads (+ and -).
  # It sits in the fuselage, so it is wired straight from the PDB pads with no wing split.
  # Its signal, capacitor and motor phase pads are in actuators_frw_system.yaml. Pin IDs are synthetic.
  ESC_FWD_IN:
    type: Solder pads
    notes: "Forward ESC battery input, + and -"
    pinlabels: [IN_POS, IN_NEG]
    ignore_in_bom: true

  # --- Parked (not used in this build) -------------------------------------------------
  # PDB on-board BEC header (J3, 2x7): four 5 V and three 12 V outputs. None of them is wired here:
  # the Cube is powered from the PDB 6-pin output (the PDB 5 V BEC, see flight_control_system.yaml)
  # and the other loads are on the two KDE UBECs (outputs modelled in cellular_system.yaml,
  # the wing fuselage-side files and rf_system.yaml). The PDB 12 V BEC is unused (4 A continuous, 5 A peak
  # per BEC, all outputs of one voltage share one bus). Kept commented out for reference.
  # Un-comment it if a load is ever wired to this header.
  #
  # PDB_J3_BEC:
  #   type: 2x7 pin header, 2.5 mm
  #   notes: "5V and 12V outputs. Pin IDs are synthetic, not the vendor numbering."
  #   pinlabels: [5V_1, 5V_2, 5V_3, 5V_4, 12V_5, 12V_6, 12V_7,
  #               GND_1, GND_2, GND_3, GND_4, GND_5, GND_6, GND_7]
  #   hide_disconnected_pins: true
  #   ignore_in_bom: true

cables:

  # PDB -> 12 V KDE UBEC input. These are the UBEC's own factory leads (16 AWG, red/black, about
  # 210 mm), so they stay out of the BOM. Keep 16 AWG if the leads are ever extended: the UBEC
  # is rated 10 A continuous output (about 120 W), so input current is about 3 A at battery voltage.
  W_PWR_01:
    wirecount: 2
    gauge: 16 AWG
    colors: [RD, BK]
    length: 0   # TODO: real length after layout analysis (factory leads are about 0.21 m)
    ignore_in_bom: true
    notes: "Factory input leads of the 12 V UBEC"

  # PDB -> 5 V KDE UBEC input. Same model as W_PWR_01, so the same factory leads (16 AWG, about
  # 210 mm, out of the BOM). Input current is about 1 A at battery voltage for the 6.4 A load.
  W_PWR_02:
    wirecount: 2
    gauge: 16 AWG
    colors: [RD, BK]
    length: 0   # TODO: real length after layout analysis (factory leads are about 0.21 m)
    ignore_in_bom: true
    notes: "Factory input leads of the 5 V UBEC"

  # PDB soft switch -> pushbutton, plain two-wire contact, so 24 AWG is plenty.
  # Colors only help tell the two ends apart; polarity does not matter.
  W_PWR_03:
    wirecount: 2
    gauge: 24 AWG
    colors: [WH, BK]
    length: 0   # TODO: real length after layout analysis
    notes: "PDB soft switch to pushbutton"

  # Capacitor leads. They come with the capacitor, so they stay out of the BOM; keep them short.
  W_PWR_04:
    wirecount: 2
    colors: [RD, BK]
    length: 0   # TODO: real length (capacitor leads, keep as short as possible)
    ignore_in_bom: true
    notes: "Capacitor leads, short as possible"

  # PDB ESC pads -> XT90 female at the wing split, one cable per VTOL motor.
  # 10 AWG (recommendation), same as the wing side (W_ACT_02 and W_ACT_03 in the two wing motors files).
  # Motor current is about 16 A at 6 kg thrust and about 75-80 A at full throttle (Vector Technics
  # 8020 PRO 120KV test table, 12S), so 10 AWG silicone wire is enough for a short run. Check that
  # it fits the PDB solder pads and the XT90 solder cups.
  # TODO: confirm with real lengths; go to 8 AWG if the run is long or hot.
  W_PWR_05:
    wirecount: 2
    gauge: 10 AWG
    colors: [RD, BK]
    length: 0   # TODO: real length after layout analysis (PDB to wing split)
    notes: "VTOL motor 1 (front right) power, PDB to wing split"

  W_PWR_06:
    wirecount: 2
    gauge: 10 AWG
    colors: [RD, BK]
    length: 0   # TODO: real length after layout analysis (PDB to wing split)
    notes: "VTOL motor 2 (rear left) power, PDB to wing split"

  W_PWR_07:
    wirecount: 2
    gauge: 10 AWG
    colors: [RD, BK]
    length: 0   # TODO: real length after layout analysis (PDB to wing split)
    notes: "VTOL motor 3 (front left) power, PDB to wing split"

  W_PWR_08:
    wirecount: 2
    gauge: 10 AWG
    colors: [RD, BK]
    length: 0   # TODO: real length after layout analysis (PDB to wing split)
    notes: "VTOL motor 4 (rear right) power, PDB to wing split"

  # PDB ESC pad -> forward ESC battery input, direct.
  # 10 AWG (recommendation), same as the VTOL motor cables. Expected current of the forward motor
  # (Vector Technics VT4130 300KV, 18 inch propeller) is similar to the VTOL motors, up to about
  # 80 A, which 10 AWG silicone wire handles over a short run.
  # APD says to keep ESC input wires short (long wires cause voltage spikes when the motor
  # brakes), and to add more capacitance if they are longer than 12 cm.
  # TODO: confirm with the real length after layout analysis and the real current (the motor test
  # data is for a smaller propeller).
  W_PWR_09:
    wirecount: 2
    gauge: 10 AWG
    colors: [RD, BK]
    length: 0   # TODO: real length after layout analysis (PDB to forward ESC, keep it short)
    notes: "Forward ESC power, PDB to ESC"

connections:

  # Battery -> PDB: battery side not decided yet (connector, cable). TODO once chosen.

  # Capacitor across the battery bolts (J2).
  - - PDB_J2BAT: [BAT_POS, BAT_NEG]
    - W_PWR_04: [1, 2]
    - CAP_BAT: [CAP_POS, CAP_NEG]

  # PDB soft switch -> pushbutton (C and NO). The LED pins are wired in another file.
  - - PDB_SW: [1, 2]
    - W_PWR_03: [1, 2]
    - SW_BTN: ["C", "NO"]

  # PDB -> 12 V UBEC. ESC7 pad pair is a placeholder; any pad pair that is free works.
  # TODO: confirm with a continuity check that the ESC pads connect straight to B+/B-.
  - - PDB_ESC: [ESC7_POS, ESC7_NEG]
    - W_PWR_01: [1, 2]
    - UBEC12_IN: [IN_POS, IN_NEG]

  # PDB -> 5 V UBEC. ESC8 pad pair is a placeholder, same checks as above.
  - - PDB_ESC: [ESC8_POS, ESC8_NEG]
    - W_PWR_02: [1, 2]
    - UBEC5_IN: [IN_POS, IN_NEG]

  # PDB ESC pads -> XT90 female at the wing split, VTOL motors 1 to 4 (ArduPilot Quad X default order:
  # 1 front right, 2 rear left, 3 front left, 4 rear right; the ESC1 to ESC4 pad pairs follow the motor number).
  # ESC1 to ESC4 pad pairs are assumed, so the pads are free for any other ESC later.
  # TODO: match the pad numbers to the real motor positions (and spin directions) once decided.
  - - PDB_ESC: [ESC1_POS, ESC1_NEG]
    - W_PWR_05: [1, 2]
    - XT90_VTOL1_F: [POS, NEG]
  - - PDB_ESC: [ESC2_POS, ESC2_NEG]
    - W_PWR_06: [1, 2]
    - XT90_VTOL2_F: [POS, NEG]
  - - PDB_ESC: [ESC3_POS, ESC3_NEG]
    - W_PWR_07: [1, 2]
    - XT90_VTOL3_F: [POS, NEG]
  - - PDB_ESC: [ESC4_POS, ESC4_NEG]
    - W_PWR_08: [1, 2]
    - XT90_VTOL4_F: [POS, NEG]

  # PDB ESC pad -> forward ESC. ESC5 pad pair is assumed (ESC1 to ESC4 are the VTOL motors,
  # ESC7 and ESC8 the BECs).
  - - PDB_ESC: [ESC5_POS, ESC5_NEG]
    - W_PWR_09: [1, 2]
    - ESC_FWD_IN: [IN_POS, IN_NEG]
