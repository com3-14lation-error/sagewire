# Right wing, wing side harness (work in progress)
# Scope: the wing side of the right wing split: DB-25 plug, the two servos (Zeus Z1500-12V, M5
# plugs), the
# three LEDs (StrobeIT at the motor tips, StrobeIT-Pro at the wingtip) and the two ESC signal pads
# (T, S, signal ground). Everything on the wing side of the DB-25.
# The fuselage side of the same DB-25 (socket, UBEC ports, Cube AUX and MAIN outputs, CAN splitter
# ports) is in actuators_right_fuselage_system.yaml; the ESC power, motors and capacitors in
# actuators_right_motors_system.yaml. The left wing is in actuators_left_*_system.yaml and the
# forward-thrust motor in actuators_frw_system.yaml. The DB-25 socket and plug are in different files,
# so the mating arrow between them is not drawn (the pin map is the same on both sides).
# ESC telemetry: bidirectional DShot on the signal wire, so the T pad is not wired.
# Cable IDs (W_ACT_nn) are the same as in the old single file.
#
# Cable lengths are 0 for now (placeholder). Real lengths come after the layout analysis.
# Gauges and colors are recommendations, see the comment above each cable.

metadata:
  title: Actuators system, right wing, wing side
  description: Right wing split (DB-25 plug), servos, LEDs, ESC signal pads

# Parts that are bought but are not connectors or cables (WireViz adds these lines to the BOM).
additional_bom_items:

  # Servos: Zeus Z1500-12V, DroneCAN version. The servo's own lead is modelled as SRV_R1 / SRV_R2
  # (not in the BOM as a connector); the M5 plug that mates with it is in the connector list.
  - description: Servo, Z1500-12V (DroneCAN)
    qty: 2
    designators: [SRV_R1, SRV_R2]
    manufacturer: Zeus
    mpn: Z1500-12V

  # LEDs: Teravolt StrobeIT at the two motor tips and StrobeIT-Pro at the wingtip, one wing each.
  # StrobeIT: RGB LED (3 W max), 20 mm round PCB, 2 x M3. StrobeIT-Pro: R/G-W LED (3 W max),
  # 57 x 20 mm PCB, 2 x M4. Both 5 V, 300 mA average, 800 mA at full brightness, PWM 1000 to 2000 us.
  - description: Strobe light, StrobeIT (RGB LED, 5 V)
    qty: 2
    designators: [LED_R1, LED_R2]
    manufacturer: Teravolt
    mpn: StrobeIT
  - description: Strobe light, StrobeIT-Pro (R/G-W LED, 5 V)
    qty: 1
    designators: [LED_RT]
    manufacturer: Teravolt
    mpn: StrobeIT-Pro

  # Wing split: the DB-25 plug is a BOM line (connector list below), the socket is in the fuselage file.
  # TODO: the DB-25 pair is not fixed yet (model, shell, contacts, hood), see the DB-25 TODOs.

connectors:

  # Signal pads (three small pads, top to bottom: T, S, -).
  # T = ESC telemetry output (serial), S = signal input (DShot), - = signal ground. Bidirectional
  # DShot is used, so the T pad stays unwired: eRPM and the telemetry data come back on S.
  ESC_VTOL1_SIG:
    type: Solder pads
    notes: "VTOL motor 1 (front right) ESC signal pads: T telemetry out, S signal in, GND signal ground"
    pinlabels: [T, S, SIG_GND]
    ignore_in_bom: true

  ESC_VTOL4_SIG:
    type: Solder pads
    notes: "VTOL motor 4 (rear right) ESC signal pads: T telemetry out, S signal in, GND signal ground"
    pinlabels: [T, S, SIG_GND]
    ignore_in_bom: true

  # ==== Wing side: DB-25 plug and wing consumers =======================================
  # The right wing carries 2 servos (DroneCAN), 3 LEDs (PWM) and 2 ESC signal links (T, S, GND).
  # Wired with NO SHARING (user decision for now): per servo 12 V and GND, per LED 5 V, signal and
  # GND, per ESC T, S and its own signal GND, and a separate CAN pair per servo. That is 23 pins per
  # wing; pins 24 and 25 are spare. The pin current rating is above what the loads need, including
  # the servos (user check).
  #
  # TODO: the DB-25 pin map below is PROVISIONAL on purpose. Freeze it in a later pass, in all the
  # DB-25 files
  # together (the pin map is identical on both wings, so the harnesses mirror).
  # Provisional DB-25 pin map (identical on both wings):
  #   1-4   servo 1: V+, GND, CAN_H, CAN_L        5-8   servo 2: V+, GND, CAN_H, CAN_L
  #   9-11  ESC 1 (forward boom): T, S, GND       12-14 ESC 2 (aft boom): T, S, GND
  #   15-17 LED 1: 5 V, signal, GND               18-20 LED 2: 5 V, signal, GND
  #   21-23 wingtip LED: 5 V, signal, GND         24-25 spare
  # The CAN pair of each servo sits on adjacent pins (twist the pair in the cable).
  # Motor numbers follow the ArduPilot QuadPlane Quad X default: 1 front right, 2 rear left,
  # 3 front left, 4 rear right. So the right wing carries VTOL motor 1 (ESC 1, forward boom) and
  # VTOL motor 4 (ESC 2, aft boom); the left wing carries VTOL motor 3 (ESC 1) and 2 (ESC 2).
  # Servos and LEDs: servo 1 and 2, LEDs R1, R2 (motor tips, StrobeIT) and RT (wingtip, StrobeIT-Pro).
  #
  # DB-25 pair per wing: socket (female) on the fuselage side, plug (male) on the wing side, so the
  # live pins are not exposed on the fuselage side. This gender choice is an assumption.
  # TODO: the DB-25 pair is not fixed yet; the DB-25 socket and plug lines in the BOM (one in the
  # fuselage file,
  # one in the wing file) are placeholders until then.
  # TODO: shell material and part numbers, contact type (crimp or solder), the contact wire range (it
  # must take both the 22 AWG power wires and the 26 AWG signal wires) and the mating hood.
  # TODO: the pin order is not fixed, so all pin references below use the pin labels. Change the
  # label list in the four connectors together (the socket in actuators_right_fuselage_system.yaml,
  # the plug in actuators_right_wing_system.yaml, and the same two for the left wing).
  SPLIT_R_WING:
    type: D-sub DB-25 plug
    subtype: male
    pincount: 25
    pinlabels: [SRV1_VPOS, SRV1_GND, SRV1_CANH, SRV1_CANL, SRV2_VPOS, SRV2_GND, SRV2_CANH, SRV2_CANL, ESC1_T, ESC1_S, ESC1_SGND, ESC2_T, ESC2_S, ESC2_SGND, LED1_5V, LED1_SIG, LED1_GND, LED2_5V, LED2_SIG, LED2_GND, LEDT_5V, LEDT_SIG, LEDT_GND, SPARE24, SPARE25]
    hide_disconnected_pins: true
    notes: "Right wing split, wing side. Provisional pin map, see above."

  # Zeus Z1500-12V servo, DroneCAN version, one connector per servo. The servo has a 200 mm lead
  # (0.14 mm2 / AWG 26, UL1061) ending in an M5 waterproof 4-pin female connector (datasheet page
  # 10, "M5 Wire"). DroneCAN pin definition: 1 power +, 2 power GND, 3 CAN High, 4 CAN Low.
  # Seen from the mating face the contacts are 3 top left, 4 top right, 2 bottom left, 1 bottom
  # right, with the key at the bottom. Rated 12 V (7 to 15 V); rated current 0.7 A, stall 1.3 A,
  # peak 2.2 A each. The lead belongs to the servo, so it is not a BOM line (the servo is, in
  # additional_bom_items). The mating M5 male
  # plug on the wing cable is SRV_Rn_M below.
  SRV_R1:
    type: M5 waterproof 4-pin female (servo lead)
    subtype: female
    manufacturer: Zeus
    notes: "Z1500-12V DroneCAN servo, right wing servo 1. 12 V, 0.7 A rated, 2.2 A peak."
    pinlabels: [V_POS, GND, CAN_H, CAN_L]
    ignore_in_bom: true

  SRV_R2:
    type: M5 waterproof 4-pin female (servo lead)
    subtype: female
    manufacturer: Zeus
    notes: "Z1500-12V DroneCAN servo, right wing servo 2. 12 V, 0.7 A rated, 2.2 A peak."
    pinlabels: [V_POS, GND, CAN_H, CAN_L]
    ignore_in_bom: true

  # M5 waterproof 4-pin male plug on the wing cable, one per servo. It mates with the servo's own
  # M5 female lead (SRV_Rn above), pin for pin: 1 power +, 2 power GND, 3 CAN High, 4 CAN Low
  # (same numbering as the servo lead, datasheet page 10). The plug is bought, so it is in the BOM.
  # All four wires into the plug are 26 AWG (W_ACT_19 to W_ACT_22 here, W_ACT_10 to W_ACT_13 on the
  # left wing), chosen to fit a small M5 solder cup (usually about 24 AWG or thinner).
  # TODO: part number, contact type (solder cup is usual) and the wire range it accepts. Also check
  # the plug's pin current rating against the 2.2 A servo peak.
  SRV_R1_M:
    type: M5 waterproof 4-pin male plug (cable end)
    subtype: male
    notes: "M5 male plug on the right wing servo 1 cable. Mates with the servo lead SRV_R1."
    pinlabels: [V_POS, GND, CAN_H, CAN_L]

  SRV_R2_M:
    type: M5 waterproof 4-pin male plug (cable end)
    subtype: male
    notes: "M5 male plug on the right wing servo 2 cable. Mates with the servo lead SRV_R2."
    pinlabels: [V_POS, GND, CAN_H, CAN_L]

  # Teravolt StrobeIT (motor tips, two per wing) and StrobeIT-Pro (wingtip, one per wing). Both have a
  # standard 3-pin servo-style interface on three solder pads: 5 V input (1 A max), PWM signal,
  # ground. Use a supply that can give 800 mA peak per LED (full-bright strobe).
  # WARNING: the pad order of the two models is mirrored, so a straight cable from the same
  # harness plug would reverse the supply. Pin IDs below are the pad positions left to right as
  # drawn in the vendor pictures: StrobeIT is -, S, +; StrobeIT-Pro is +, S, -.
  # TODO: lead or header type to solder on (not decided).
  LED_R1:
    type: Solder pads
    manufacturer: Teravolt
    notes: "StrobeIT, right wing LED 1 (motor tip). Pads left to right: GND, SIGNAL (PWM), 5V."
    pinlabels: [GND, SIGNAL, 5V]
    ignore_in_bom: true

  LED_R2:
    type: Solder pads
    manufacturer: Teravolt
    notes: "StrobeIT, right wing LED 2 (motor tip). Pads left to right: GND, SIGNAL (PWM), 5V."
    pinlabels: [GND, SIGNAL, 5V]
    ignore_in_bom: true

  LED_RT:
    type: Solder pads
    manufacturer: Teravolt
    notes: "StrobeIT-Pro, right wingtip LED. Pads left to right: 5V, SIGNAL (PWM), GND."
    pinlabels: [5V, SIGNAL, GND]
    ignore_in_bom: true

cables:

  # ---- Wing split, no sharing ----------------------------------------------------------
  # Wing side: DB-25 plug -> servo M5 plug, LED and ESC signal pads (one cable per link).
  # LED wires: 22 AWG (LED 0.8 A peak; the run may be a few metres).
  # Servo power, signal and CAN wires: 26 AWG. The servo power wires are 26 AWG so they fit the M5
  # plug solder cups (the servo lead itself is 26 AWG, and GH contacts take 26 AWG at most). The
  # cost is voltage drop, see below.
  # Colors: servo CAN_H yellow, CAN_L green; ESC T yellow, S white, signal GND black; LED 5 V red,
  # signal white, GND black.
  # TODO: twisted pair for CAN and for each ESC T/S/GND trio (APD: signal GND twisted with the signal).
  # Servo power, 26 AWG: voltage drop. 26 AWG is about 0.13 ohm per metre, so over 3 m one way (6 m
  # loop) the 2.2 A servo peak drops about 1.8 V and the 0.7 A rated current about 0.6 V. The servo
  # takes 7 to 15 V and is fed 12 V, so check that the supply and the real wire length leave enough
  # margin; shorten the run or raise the supply voltage if not.
  W_ACT_19:
    wirecount: 2
    gauge: 26 AWG
    colors: [RD, BK]
    length: 0   # TODO: real length after layout analysis (wing plug to servo)
    notes: "Right wing servo 1 power: 12 V and GND, wing plug to servo"
  W_ACT_20:
    wirecount: 2
    gauge: 26 AWG
    colors: [YE, GN]
    length: 0   # TODO: real length after layout analysis (wing plug to servo)
    notes: "Right wing servo 1 CAN pair, wing plug to servo (twisted pair)"

  # Servo power, 26 AWG: voltage drop is about 1.8 V at the 2.2 A peak over a 3 m run one way (see
  # W_ACT_19).
  W_ACT_21:
    wirecount: 2
    gauge: 26 AWG
    colors: [RD, BK]
    length: 0   # TODO: real length after layout analysis (wing plug to servo)
    notes: "Right wing servo 2 power: 12 V and GND, wing plug to servo"
  W_ACT_22:
    wirecount: 2
    gauge: 26 AWG
    colors: [YE, GN]
    length: 0   # TODO: real length after layout analysis (wing plug to servo)
    notes: "Right wing servo 2 CAN pair, wing plug to servo (twisted pair)"
  W_ACT_23:
    wirecount: 3
    gauge: 22 AWG
    colors: [RD, WH, BK]
    length: 0   # TODO: real length after layout analysis (wing plug to LED)
    notes: "Right wing LED 1 (StrobeIT): 5 V, signal, GND, wing plug to LED"
  W_ACT_24:
    wirecount: 3
    gauge: 22 AWG
    colors: [RD, WH, BK]
    length: 0   # TODO: real length after layout analysis (wing plug to LED)
    notes: "Right wing LED 2 (StrobeIT): 5 V, signal, GND, wing plug to LED"
  W_ACT_25:
    wirecount: 3
    gauge: 22 AWG
    colors: [RD, WH, BK]
    length: 0   # TODO: real length after layout analysis (wing plug to LED)
    notes: "Right wing wingtip LED (StrobeIT-Pro): 5 V, signal, GND, wing plug to LED"
  W_ACT_26:
    wirecount: 3
    gauge: 26 AWG
    colors: [YE, WH, BK]
    length: 0   # TODO: real length after layout analysis (wing plug to ESC)
    notes: "Right wing ESC 1 (forward boom, VTOL motor 1, front right) signal: T, S, signal GND, wing plug to ESC"
  W_ACT_27:
    wirecount: 3
    gauge: 26 AWG
    colors: [YE, WH, BK]
    length: 0   # TODO: real length after layout analysis (wing plug to ESC)
    notes: "Right wing ESC 2 (aft boom, VTOL motor 4, rear right) signal: T, S, signal GND, wing plug to ESC"

connections:

  # ==== Right wing, wing side of the DB-25 (provisional pin map) ====================
  # The DB-25 plug connects to the wing consumers pin for pin (the cables use the pin labels).
  # Its mate, the socket, is in the fuselage file.

  -
    - SPLIT_R_WING: [SRV1_VPOS, SRV1_GND]
    - W_ACT_19: [1, 2]
    - SRV_R1_M: [V_POS, GND]
  -
    - SPLIT_R_WING: [SRV1_CANH, SRV1_CANL]
    - W_ACT_20: [1, 2]
    - SRV_R1_M: [CAN_H, CAN_L]
  -
    - SRV_R1_M: [1, 2, 3, 4]
    - -->
    - SRV_R1: [1, 2, 3, 4]
  -
    - SPLIT_R_WING: [SRV2_VPOS, SRV2_GND]
    - W_ACT_21: [1, 2]
    - SRV_R2_M: [V_POS, GND]
  -
    - SPLIT_R_WING: [SRV2_CANH, SRV2_CANL]
    - W_ACT_22: [1, 2]
    - SRV_R2_M: [CAN_H, CAN_L]
  -
    - SRV_R2_M: [1, 2, 3, 4]
    - -->
    - SRV_R2: [1, 2, 3, 4]
  -
    - SPLIT_R_WING: [LED1_5V, LED1_SIG, LED1_GND]
    - W_ACT_23: [1, 2, 3]
    - LED_R1: [5V, SIGNAL, GND]
  -
    - SPLIT_R_WING: [LED2_5V, LED2_SIG, LED2_GND]
    - W_ACT_24: [1, 2, 3]
    - LED_R2: [5V, SIGNAL, GND]
  -
    - SPLIT_R_WING: [LEDT_5V, LEDT_SIG, LEDT_GND]
    - W_ACT_25: [1, 2, 3]
    - LED_RT: [5V, SIGNAL, GND]
  -
    - SPLIT_R_WING: [ESC1_T, ESC1_S, ESC1_SGND]
    - W_ACT_26: [1, 2, 3]
    - ESC_VTOL1_SIG: [T, S, SIG_GND]
  -
    - SPLIT_R_WING: [ESC2_T, ESC2_S, ESC2_SGND]
    - W_ACT_27: [1, 2, 3]
    - ESC_VTOL4_SIG: [T, S, SIG_GND]
