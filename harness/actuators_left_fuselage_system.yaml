# Left wing, fuselage side harness (work in progress)
# Scope: the fuselage side of the left wing split: DB-25 socket and the sources that feed it: 12 V
# KDE UBEC servo ports 1 and 2 (servos),
# 5 V KDE UBEC servo ports 1 to 3 (LEDs), Cube AUX OUT 3 (motor 3) and AUX OUT 2 (motor 2) for the
# ESC signals and Cube MAIN OUT 1 to 3 for the LED PWM. Also the
# CAN splitter ports 2 and 3 (servo CAN branches).
# The wing side of the same DB-25 (plug, servos, LEDs, ESC signal pads) is in
# actuators_left_wing_system.yaml; the ESC power, motors and capacitors in
# actuators_left_motors_system.yaml. The right wing is in actuators_right_*_system.yaml and the
# forward-thrust motor in actuators_frw_system.yaml. The DB-25 socket and plug are in different files,
# so the mating arrow between them is not drawn (the pin map is the same on both sides).
# ESC telemetry: bidirectional DShot on the signal wire (see the Cube AUX OUT note).
# Cable IDs (W_ACT_nn) are the same as in the old single file.
#
# Cable lengths are 0 for now (placeholder). Real lengths come after the layout analysis.
# Gauges and colors are recommendations, see the comment above each cable.

metadata:
  title: Actuators system, left wing, fuselage side
  description: Left wing split (DB-25 socket), UBEC servo ports, Cube AUX and MAIN, CAN splitter ports

connectors:

  # ==== Fuselage side: DB-25 socket and the fuselage ends of the wing cables ====================
  # The left wing carries 2 servos (DroneCAN), 3 LEDs (PWM) and 2 ESC signal links (T, S, GND).
  # Wired with NO SHARING (user decision for now): per servo 12 V and GND, per LED 5 V, signal and
  # GND, per ESC T, S and its own signal GND, and a separate CAN pair per servo. That is 23 pins per
  # wing; pins 24 and 25 are spare. The pin current rating is above what the loads need, including
  # the servos (user check).
  #
  # TODO: the DB-25 pin map below is PROVISIONAL on purpose. Freeze it in a later pass, in all the
  # DB-25 files
  # together (the pin map is identical on both wings, so the harnesses mirror).
  # Provisional DB-25 pin map (identical on both wings):
  #   1-4   servo 1: V+, GND, CAN_H, CAN_L        5-8   servo 2: V+, GND, CAN_H, CAN_L
  #   9-11  ESC 1 (forward boom): T, S, GND       12-14 ESC 2 (aft boom): T, S, GND
  #   15-17 LED 1: 5 V, signal, GND               18-20 LED 2: 5 V, signal, GND
  #   21-23 wingtip LED: 5 V, signal, GND         24-25 spare
  # The CAN pair of each servo sits on adjacent pins (twist the pair in the cable).
  # Motor numbers follow the ArduPilot QuadPlane Quad X default: 1 front right, 2 rear left,
  # 3 front left, 4 rear right. So the left wing carries VTOL motor 3 (ESC 1, forward boom) and
  # VTOL motor 2 (ESC 2, aft boom); the right wing carries VTOL motor 1 (ESC 1) and 4 (ESC 2).
  # Servos and LEDs: servo 1 and 2, LEDs L1, L2 (motor tips, StrobeIT) and LT (wingtip,
  # StrobeIT-Pro) per wing.
  #
  # DB-25 pair per wing: socket (female) on the fuselage side, plug (male) on the wing side, so the
  # live pins are not exposed on the fuselage side. This gender choice is an assumption.
  # TODO: the DB-25 pair is not fixed yet; the DB-25 socket and plug lines in the BOM (one in the
  # fuselage file,
  # one in the wing file) are placeholders until then.
  # TODO: shell material and part numbers, contact type (crimp or solder), the contact wire range (it
  # must take both the 22 AWG power wires and the 26 AWG signal wires) and the mating hood.
  # TODO: the pin order is not fixed, so all pin references below use the pin labels. Change the
  # label list in the four connectors together (the socket in actuators_left_fuselage_system.yaml,
  # the plug in actuators_left_wing_system.yaml, and the same two for the right wing).
  SPLIT_L_FUS:
    type: D-sub DB-25 socket
    subtype: female
    pincount: 25
    pinlabels: [SRV1_VPOS, SRV1_GND, SRV1_CANH, SRV1_CANL, SRV2_VPOS, SRV2_GND, SRV2_CANH, SRV2_CANL, ESC1_T, ESC1_S, ESC1_SGND, ESC2_T, ESC2_S, ESC2_SGND, LED1_5V, LED1_SIG, LED1_GND, LED2_5V, LED2_SIG, LED2_GND, LEDT_5V, LEDT_SIG, LEDT_GND, SPARE24, SPARE25]
    hide_disconnected_pins: true
    notes: "Left wing split, fuselage side. Provisional pin map, see above."

  # CAN splitter: SwiftWing 6-port passive splitter, JST-GH 4-pin ports. All ports are bussed in
  # parallel inside the splitter (pin 1 = +5 V, 2 = CAN_H, 3 = CAN_L, 4 = GND on every port); it has
  # no termination and no isolation. Each port is modelled as its own connector (harness side
  # housing). Port 1 goes to the Cube CAN2 port and is modelled in flight_control_system.yaml
  # (CAN_SPL_P1), so it is not defined here; ports 2 to 5 take one servo each (no sharing): ports 2
  # and 3 are the left wing servos (this file), ports 4 and 5 the right wing servos (right fuselage
  # file); port 6 is spare. Which physical port is which does not matter, they are all the same net.
  # WARNING: the splitter pin 1 is 5 V and bussed. The servos have 12 V on their pin 1, so the servo
  # branches use only CAN_H, CAN_L and GND: pin 1 stays empty on ports 2 to 5. The GND wire is the
  # same DB-25 pin as the servo power GND, and the 12 V supply is now wired (W_ACT_42, W_ACT_43),
  # so the servo return current has two paths (the power wire back to the 12 V UBEC and, through the
  # splitter GND, the Cube); the power wire is the short, heavier path, so it takes almost all of it.
  # NOTE: the Zeus servos have NO built-in CAN termination (mostly confirmed, not yet measured), so
  # the bus end at the Cube (120 ohm on the Cube port) is the only termination on this branch.
  # TODO: confirm by measuring CAN_H to CAN_L on a servo, power off. If a servo does turn out to
  # have a built-in 120 ohm, four of them in parallel (30 ohm) on the bussed splitter would be far
  # below the 60 ohm of a correctly terminated bus. (docs/CAN Termination for Servos.md still
  # says the servos are terminated; that doc is being rewritten.) With no sharing the bus is a star,
  # so the stubs (wing half-span plus fuselage
  # run) are far over the 0.3 m rule of thumb; lower the bitrate if the servos allow it.
  # TODO: GH housing part number and contact type (GHR-04V-S with SSHL-002T-P0.2 for 26 AWG), and
  # confirm that the splitter ports are SM04B-GHS-TB headers.
  CAN_SPL_P2:
    type: JST GH 4-pin plug housing
    subtype: female
    manufacturer: JST
    mpn: GHR-04V-S
    notes: "CAN splitter port 2 (passive, bussed): left wing servo 1"
    pinlabels: [VCC_5V, CAN_H, CAN_L, GND]

  CAN_SPL_P3:
    type: JST GH 4-pin plug housing
    subtype: female
    manufacturer: JST
    mpn: GHR-04V-S
    notes: "CAN splitter port 3 (passive, bussed): left wing servo 2"
    pinlabels: [VCC_5V, CAN_H, CAN_L, GND]

  # ---- UBEC servo ports: fuselage-side power for the wing servos (12 V) and LEDs (5 V) ------------
  # Both KDE UBECUVC have six 3-pin male servo headers (JST-style servo pin-out, pin order S, +, -,
  # 3.3 A max per port). The harness side is a standard 3-pin servo plug housing (2.54 mm); only +
  # and - are used, S stays empty (the LED and servo signals do not come from the UBEC). One port
  # per load, so every wing load has its own pair from the UBEC to the DB-25 (no sharing).
  # Orient each plug so S/+/- are not swapped (the UBEC drawing shows the correct orientation).
  # 12 V UBEC ports 1 to 4: servos (2.2 A burst, 1.3 A stall, 0.7 A rated each; port limit 3.3 A);
  # ports 1 and 2 are the left wing servos (this file), ports 3 and 4 the right wing ones.
  # 5 V UBEC ports 1 to 6: LEDs (0.8 A peak, 1 A max each); ports 1 to 3 are the left wing LEDs
  # (this file), ports 4 to 6 the right wing ones.
  # Port 5 and 6 of the 12 V UBEC: port 5 is the camera (cellular_system.yaml), port 6 is spare.
  # Plug housing: Molex KK 254 3-pin (DuPont), the same family as the Cube AUX and MAIN plugs.
  # TODO: check that its contacts take 22 AWG and 3 A.
  UBEC12_SRV1:
    type: Molex KK 254 3-pin housing (DuPont)
    manufacturer: Molex
    subtype: female
    notes: "12 V UBEC servo port 1: left wing servo 1 (12 V and GND). S not wired."
    pinlabels: [S, V_POS, GND]
    hide_disconnected_pins: true

  UBEC12_SRV2:
    type: Molex KK 254 3-pin housing (DuPont)
    manufacturer: Molex
    subtype: female
    notes: "12 V UBEC servo port 2: left wing servo 2 (12 V and GND). S not wired."
    pinlabels: [S, V_POS, GND]
    hide_disconnected_pins: true

  UBEC5_LED1:
    type: Molex KK 254 3-pin housing (DuPont)
    manufacturer: Molex
    subtype: female
    notes: "5 V UBEC servo port 1: left wing LED 1 (5 V and GND). S not wired."
    pinlabels: [S, V_POS, GND]
    hide_disconnected_pins: true

  UBEC5_LED2:
    type: Molex KK 254 3-pin housing (DuPont)
    manufacturer: Molex
    subtype: female
    notes: "5 V UBEC servo port 2: left wing LED 2 (5 V and GND). S not wired."
    pinlabels: [S, V_POS, GND]
    hide_disconnected_pins: true

  UBEC5_LED3:
    type: Molex KK 254 3-pin housing (DuPont)
    manufacturer: Molex
    subtype: female
    notes: "5 V UBEC servo port 3: left wingtip LED (5 V and GND). S not wired."
    pinlabels: [S, V_POS, GND]
    hide_disconnected_pins: true

  # ---- Cube Orange+ AUX OUT: ESC signals (DShot) -----------------------------------------------
  # The Cube AUX OUT 1 to 6 and MAIN OUT 1 to 8 are 2.54 mm (0.1 inch) male pin headers, three rows:
  # ground on top, power in the middle, signal at the bottom (Cube pin label S, +, -). They accept
  # standard DuPont female housings. AUX OUT is on the FMU, so it can do DShot (MAIN OUT, on the IO
  # MCU, is PWM only), which is why the motors are on AUX. Motor n sits on AUX n (ArduPilot Quad X
  # default order): AUX 1 front right, AUX 2 rear left, AUX 3 front left, AUX 4 rear right, and the
  # forward-thrust motor on AUX 5.
  # One 3-pin housing per port, only signal and ground wired. The middle (power) slot stays EMPTY: the
  # ESCs have no BEC output and the Cube servo rail must not be fed from here.
  # Plug housing: Molex KK 254 3-pin (DuPont). TODO: orient each plug so signal is on the
  # signal row (bottom row in the Cube pin picture).
  # ESC telemetry: Bidirectional DShot will be used. The single signal wire carries the throttle
  # command to the ESC and reports back the eRPM and the telemetry data on the same wire, so the ESC
  # T wire is not wired and no extra serial port on the Cube is needed. Bidirectional DShot needs
  # DShot-capable timers (AUX OUT on the FMU) and an ESC firmware that supports it.
  # Confirmed by the APD 120F3[X]v2 specification table: bidirectional DShot YES, DShot frequency
  # auto-detected (150, 300 or 600 kbit/s), PWM 50 to 499 Hz.
  FC_AUX2:
    type: Molex KK 254 3-pin housing (DuPont)
    manufacturer: Molex
    subtype: female
    notes: "Cube Orange+ AUX OUT 2: VTOL motor 2 (rear left) ESC signal. Signal and ground only, power slot empty."
    pinlabels: [S, V_POS, GND]
    hide_disconnected_pins: true

  FC_AUX3:
    type: Molex KK 254 3-pin housing (DuPont)
    manufacturer: Molex
    subtype: female
    notes: "Cube Orange+ AUX OUT 3: VTOL motor 3 (front left) ESC signal. Signal and ground only, power slot empty."
    pinlabels: [S, V_POS, GND]
    hide_disconnected_pins: true

  # ---- Cube Orange+ MAIN OUT: LED PWM ------------------------------------------------------------
  # The LEDs (StrobeIT and StrobeIT-Pro, servo-style PWM input) are on MAIN OUT 1 to 6, which is
  # plain servo PWM from the IO MCU, enough for an LED. MAIN OUT 7 and 8 stay free. Same 2.54 mm
  # headers and DuPont housings as the AUX ports above (signal bottom row, power middle, ground
  # top): only signal and ground are wired, the power slot stays EMPTY (the LEDs are powered from
  # the 5 V UBEC, never from the Cube header).
  # Mapping: MAIN 1 left LED 1, MAIN 2 left LED 2, MAIN 3 left wingtip LED, MAIN 4 right LED 1,
  # MAIN 5 right LED 2, MAIN 6 right wingtip LED.
  # Ground: the Cube ground wire lands on the same DB-25 LEDn_GND pin as the UBEC return wire (the
  # StrobeIT datasheet says connect GND to the flight controller). The UBEC wire takes the LED
  # current; the Cube wire is only the signal reference. The wing carries one GND wire per LED.
  # NOTE: the LEDs could share if needed. They likely all get the same command, so one MAIN output
  # could drive several of them (or all six) through a split. Kept at one output per LED for now (no
  # sharing).
  # TODO: what the StrobeIT expects (on/off threshold or pattern selection by pulse width) before
  # setting the ArduPilot output function; the DB-25 contact must take
  # two wires on the LED ground pins.
  FC_MAIN1:
    type: Molex KK 254 3-pin housing (DuPont)
    manufacturer: Molex
    subtype: female
    notes: "Cube Orange+ MAIN OUT 1: left wing LED 1 PWM. Signal and ground only, power slot empty."
    pinlabels: [S, V_POS, GND]
    hide_disconnected_pins: true

  FC_MAIN2:
    type: Molex KK 254 3-pin housing (DuPont)
    manufacturer: Molex
    subtype: female
    notes: "Cube Orange+ MAIN OUT 2: left wing LED 2 PWM. Signal and ground only, power slot empty."
    pinlabels: [S, V_POS, GND]
    hide_disconnected_pins: true

  FC_MAIN3:
    type: Molex KK 254 3-pin housing (DuPont)
    manufacturer: Molex
    subtype: female
    notes: "Cube Orange+ MAIN OUT 3: left wingtip LED PWM. Signal and ground only, power slot empty."
    pinlabels: [S, V_POS, GND]
    hide_disconnected_pins: true

cables:

  # Fuselage side: DB-25 socket CAN_H, CAN_L and GND of each servo -> its own port on the CAN
  # splitter (GH housing pins 2, 3, 4). No 5 V (pin 1 stays empty), see the splitter warnings in
  # the connectors section. The servo power (12 V) and the LED power (5 V) are wired on the fuselage
  # side further down (here W_ACT_42, W_ACT_43 and W_ACT_46 to W_ACT_48; the rest are in the right
  # fuselage file), from the servo ports of the two KDE UBECs.
  # Colors: CAN_H yellow, CAN_L green, GND black. Twist CAN_H with CAN_L.
  W_ACT_28:
    wirecount: 3
    gauge: 26 AWG
    colors: [YE, GN, BK]
    length: 0   # TODO: real length after layout analysis (fuselage DB-25 to splitter)
    notes: "Left wing servo 1 CAN_H, CAN_L and GND, fuselage DB-25 to CAN splitter (twist CAN_H/CAN_L)"
  W_ACT_29:
    wirecount: 3
    gauge: 26 AWG
    colors: [YE, GN, BK]
    length: 0   # TODO: real length after layout analysis (fuselage DB-25 to splitter)
    notes: "Left wing servo 2 CAN_H, CAN_L and GND, fuselage DB-25 to CAN splitter (twist CAN_H/CAN_L)"

  # Fuselage side power: KDE UBEC servo ports -> DB-25 socket. 22 AWG (2.2 A servo burst, 0.8 A LED
  # peak), the same heavier wire as the LED wing cables, and short (UBEC to the DB-25 in the
  # fuselage). The wing side is 26 AWG for the servos (W_ACT_10 and following) and 22 AWG for the
  # LEDs. Colors: red = positive, black = ground.
  # TODO: the DB-25 contact must take 22 AWG (see the DB-25 TODO), real lengths after layout.
  W_ACT_42:
    wirecount: 2
    gauge: 22 AWG
    colors: [RD, BK]
    length: 0   # TODO: real length after layout analysis (UBEC to fuselage DB-25)
    notes: "12 V UBEC servo port 1 to left wing servo 1 power (12 V and GND), fuselage DB-25"
  W_ACT_43:
    wirecount: 2
    gauge: 22 AWG
    colors: [RD, BK]
    length: 0   # TODO: real length after layout analysis (UBEC to fuselage DB-25)
    notes: "12 V UBEC servo port 2 to left wing servo 2 power (12 V and GND), fuselage DB-25"
  W_ACT_46:
    wirecount: 2
    gauge: 22 AWG
    colors: [RD, BK]
    length: 0   # TODO: real length after layout analysis (UBEC to fuselage DB-25)
    notes: "5 V UBEC servo port 1 to left wing LED 1 power (5 V and GND), fuselage DB-25"
  W_ACT_47:
    wirecount: 2
    gauge: 22 AWG
    colors: [RD, BK]
    length: 0   # TODO: real length after layout analysis (UBEC to fuselage DB-25)
    notes: "5 V UBEC servo port 2 to left wing LED 2 power (5 V and GND), fuselage DB-25"
  W_ACT_48:
    wirecount: 2
    gauge: 22 AWG
    colors: [RD, BK]
    length: 0   # TODO: real length after layout analysis (UBEC to fuselage DB-25)
    notes: "5 V UBEC servo port 3 to left wingtip LED power (5 V and GND), fuselage DB-25"

  # Cube AUX OUT -> ESC signal and signal ground, one cable per motor: two wires, signal white and
  # ground black, twisted together all the way (APD: twist the signal with its ground). The four
  # VTOL ones go to the fuselage DB-25 and continue through the wing cable; on the left wing these
  # are AUX 3 and AUX 2 (W_ACT_54, W_ACT_53, continuing in W_ACT_17 and W_ACT_18 in the wing file).
  # AUX 1 and AUX 4
  # are in the right fuselage file and AUX 5 (forward ESC) in actuators_frw_system.yaml. 26 AWG
  # matches the
  # wing side and fits DuPont contacts (typically 22 to 28 AWG).
  # Long run: fuselage to DB-25, then 26 AWG up to the boom, a few metres in total. DShot has little
  # margin on long runs (edge rate), so the protocol is a decision for later: DShot150 or DShot300, or
  # fall back to PWM or Oneshot if the signal is not clean.
  # The APD 120F3 accepts DShot 150, 300 and 600 (auto-detected) and PWM 50 to 499 Hz.
  # TODO: real lengths after layout; the maximum cable length for the DShot rate chosen;
  # shielding if noisy.
  W_ACT_53:
    wirecount: 2
    gauge: 26 AWG
    colors: [WH, BK]
    length: 0   # TODO: real length after layout analysis (Cube to fuselage DB-25)
    notes: "Cube AUX 2 to VTOL motor 2 (rear left) ESC signal and ground, fuselage DB-25 (twisted pair)"
  W_ACT_54:
    wirecount: 2
    gauge: 26 AWG
    colors: [WH, BK]
    length: 0   # TODO: real length after layout analysis (Cube to fuselage DB-25)
    notes: "Cube AUX 3 to VTOL motor 3 (front left) ESC signal and ground, fuselage DB-25 (twisted pair)"

  # Cube MAIN OUT -> LED PWM and signal ground, one cable per LED: signal white, ground black. The
  # signal is slow servo PWM and carries almost no current, so 26 AWG is plenty and the run length
  # does not matter the way it does for DShot. The ground wire joins the UBEC return on the DB-25
  # LEDn_GND pin (see the MAIN OUT comment). Twist the pair.
  # TODO: real lengths after layout.
  W_ACT_57:
    wirecount: 2
    gauge: 26 AWG
    colors: [WH, BK]
    length: 0   # TODO: real length after layout analysis (Cube to fuselage DB-25)
    notes: "Cube MAIN 1 to left wing LED 1 PWM and ground, fuselage DB-25 (twisted pair)"
  W_ACT_58:
    wirecount: 2
    gauge: 26 AWG
    colors: [WH, BK]
    length: 0   # TODO: real length after layout analysis (Cube to fuselage DB-25)
    notes: "Cube MAIN 2 to left wing LED 2 PWM and ground, fuselage DB-25 (twisted pair)"
  W_ACT_59:
    wirecount: 2
    gauge: 26 AWG
    colors: [WH, BK]
    length: 0   # TODO: real length after layout analysis (Cube to fuselage DB-25)
    notes: "Cube MAIN 3 to left wingtip LED PWM and ground, fuselage DB-25 (twisted pair)"

connections:

  # ==== Left wing, fuselage side of the DB-25 (provisional pin map) ===============
  # The DB-25 socket takes the cables from the CAN splitter, the UBEC servo ports and the Cube AUX and
  # MAIN outputs. Its mate, the plug, is in the wing file (pin for pin, pins 1 to 23).

  -
    - SPLIT_L_FUS: [SRV1_CANH, SRV1_CANL, SRV1_GND]
    - W_ACT_28: [1, 2, 3]
    - CAN_SPL_P2: [CAN_H, CAN_L, GND]
  -
    - SPLIT_L_FUS: [SRV2_CANH, SRV2_CANL, SRV2_GND]
    - W_ACT_29: [1, 2, 3]
    - CAN_SPL_P3: [CAN_H, CAN_L, GND]

  # Fuselage side power, left wing: 12 V UBEC ports 1 and 2 (servos), 5 V UBEC ports 1 to 3 (LEDs).
  -
    - UBEC12_SRV1: [V_POS, GND]
    - W_ACT_42: [1, 2]
    - SPLIT_L_FUS: [SRV1_VPOS, SRV1_GND]
  -
    - UBEC12_SRV2: [V_POS, GND]
    - W_ACT_43: [1, 2]
    - SPLIT_L_FUS: [SRV2_VPOS, SRV2_GND]
  -
    - UBEC5_LED1: [V_POS, GND]
    - W_ACT_46: [1, 2]
    - SPLIT_L_FUS: [LED1_5V, LED1_GND]
  -
    - UBEC5_LED2: [V_POS, GND]
    - W_ACT_47: [1, 2]
    - SPLIT_L_FUS: [LED2_5V, LED2_GND]
  -
    - UBEC5_LED3: [V_POS, GND]
    - W_ACT_48: [1, 2]
    - SPLIT_L_FUS: [LEDT_5V, LEDT_GND]

  # Fuselage side ESC signal, left wing: Cube AUX 3 (motor 3, ESC 1 forward boom) and AUX 2 (motor
  # 2, ESC 2 aft boom).
  -
    - FC_AUX3: [S, GND]
    - W_ACT_54: [1, 2]
    - SPLIT_L_FUS: [ESC1_S, ESC1_SGND]
  -
    - FC_AUX2: [S, GND]
    - W_ACT_53: [1, 2]
    - SPLIT_L_FUS: [ESC2_S, ESC2_SGND]

  # Fuselage side LED PWM, left wing: Cube MAIN 1 to 3. The ground lands on the LEDn_GND pin that
  # already has the UBEC return.
  -
    - FC_MAIN1: [S, GND]
    - W_ACT_57: [1, 2]
    - SPLIT_L_FUS: [LED1_SIG, LED1_GND]
  -
    - FC_MAIN2: [S, GND]
    - W_ACT_58: [1, 2]
    - SPLIT_L_FUS: [LED2_SIG, LED2_GND]
  -
    - FC_MAIN3: [S, GND]
    - W_ACT_59: [1, 2]
    - SPLIT_L_FUS: [LEDT_SIG, LEDT_GND]
